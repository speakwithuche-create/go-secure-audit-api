name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Always build with the latest supported Go release so standard
          # library security fixes are picked up (go.mod sets the minimum).
          go-version: stable
      - name: Format and vet
        run: make lint
      - name: Unit tests with race detector
        run: make race
      - name: Tests with FIPS 140-3 mode on
        run: make fips-test
      - name: FIPS startup gate
        run: make fips-gate
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t secure-audit-api:${{ github.sha }} .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-audit-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
